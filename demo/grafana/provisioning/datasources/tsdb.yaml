apiVersion: 1
datasources:
  - name: TSDB
    uid: tsdb
    type: prometheus
    access: proxy
    url: http://tsdb:8080
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 1s
      disableMetricsLookup: false
      seriesEndpoint: false
      prometheusType: Prometheus
      prometheusVersion: 2.50.0
      manageAlerts: false
